<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JeevCare</title>
    <link rel="icon" href="/assets/icons/favicon.ico">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/auth/login.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="container auth-container animate-fade-in">
        <div class="auth-header">
            <a href="/index.html" class="nav-logo justify-center fs-2">Jeev<span class="text-brand">Care</span></a>
            <p class="mt-40 text-muted fs-11">Welcome back! Please login to your
                account.</p>
        </div>

        <div class="glass-card auth-card">
            <div id="errorBox" class="error-msg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-20" id="loginBtn">Sign
                    In</button>
            </form>
            <div class="text-center mt-40 fs-095 text-muted">
                Don't have an account? <a class="fw-600" href="/auth/register.html">Register here</a>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/pages/auth/login.js"></script>
</body>

</html>

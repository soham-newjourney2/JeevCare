<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Dashboard | JeevCare</title>
    <link rel="icon" href="/assets/icons/favicon.ico">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/authority/dashboard.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
</head>

<body class="dash-layout">

    <div id="nav-placeholder" data-nav="app" data-label="Authority Portal"></div>
    <div id="sidebar-placeholder" data-role="authority" data-active="dashboard"></div>

    <main class="dash-main animate-fade-in">
        <h1 class="fs-25">Authority Overview</h1>
        <p class="text-muted mb-40">Real-time oversight of critical incidents and system-wide
            analytics.</p>

        <div class="grid-3 mb-20">
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_total">0</div>
                <div class="metric-label">Total Incidents</div>
            </div>
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_active">0</div>
                <div class="metric-label">Active Cases</div>
            </div>
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_closed">0</div>
                <div class="metric-label">Closed Cases</div>
            </div>
        </div>

        <div class="glass-card mt-40">
            <h3>Quick Actions</h3>
            <div class="d-flex gap-20 mt-20">
                <a href="/authority/alerts.html" class="btn btn-primary">Broadcast Alert</a>
                <a href="/authority/reports.html" class="btn btn-outline">View Audit Logs</a>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/authority/dashboard.js"></script>
</body>

</html>

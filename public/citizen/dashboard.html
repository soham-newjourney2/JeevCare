<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Dashboard | JeevCare</title>
    <link rel="icon" href="/assets/icons/favicon.ico">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/citizen/dashboard.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
</head>

<body class="dash-layout">

    <div id="nav-placeholder" data-nav="app" data-label="Citizen Portal"></div>

    <div id="sidebar-placeholder" data-role="citizen" data-active="dashboard"></div>

    <main class="dash-main animate-fade-in">
        <div id="broadcastBanner" class="notice-banner d-none" role="alert"></div>
        <h1 class="fs-25">Welcome back, <span id="userNameTitle">Citizen</span>!</h1>
        <p class="text-muted mb-40">Here is an overview of your impact and trust standing in the
            community.</p>

        <div class="grid-3 mb-20">
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_reports">0</div>
                <div class="metric-label">Total Valid Reports</div>
            </div>
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_score">0</div>
                <div class="metric-label">Trust Score</div>
            </div>
            <div class="glass-card metric-card">
                <div class="metric-number" id="m_active">0</div>
                <div class="metric-label">Active / Pending Cases</div>
            </div>
        </div>

        <div class="glass-card mt-20 text-center">
            <h3 class="mb-15">Your Badges</h3>
            <div id="badgesContainer">Loading badges...</div>
        </div>

        <div class="glass-card mt-40">
            <h3>Quick Actions</h3>
            <div class="d-flex gap-20 mt-20">
                <a href="/citizen/report.html" class="btn btn-primary">Report New Incident</a>
                <a href="/citizen/services.html" class="btn btn-outline">Find a Nearest Vet</a>
            </div>
        </div>
    </main>

    <script src="/socket.io/socket.io.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>

    <script src="/assets/js/pages/citizen/dashboard.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt & Foster | JeevCare</title>
    <link rel="icon" href="/assets/icons/favicon.ico">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/citizen/adopt.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">
</head>

<body class="dash-layout">
    <div id="nav-placeholder" data-nav="app" data-label="Citizen Portal"></div>
    <div id="sidebar-placeholder" data-role="citizen" data-active="adopt"></div>

    <main class="dash-main animate-fade-in">
        <h1 class="fs-22 mb-10">Find a Companion</h1>
        <p class="text-muted mb-30">Open your home to a rescued animal. Adopt or foster them.</p>

        <div class="grid-pets" id="petsContainer">
        </div>
    </main>

    <div class="modal" id="applyModal">
        <div class="modal-content">
            <h2 class="mb-20" id="modalTitle">Apply</h2>
            <form id="applyForm">
                <input type="hidden" id="petId">
                <div class="form-group">
                    <label class="form-label" for="aType">Application Type</label>
                    <select id="aType" class="form-input" required>
                        <option value="adopt">Adopt</option>
                        <option value="foster">Foster</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="aExp">Your Experience</label>
                    <textarea id="aExp" class="form-input" rows="2"
                        placeholder="Tell us about your experience with pets..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="aHouse">Housing Type</label>
                    <select id="aHouse" class="form-input" required>
                        <option value="Apartment">Apartment</option>
                        <option value="House">House</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="aReason">Why do you want to adopt/foster this pet?</label>
                    <textarea id="aReason" class="form-input" rows="3" required></textarea>
                </div>
                <div class="d-flex gap-10 mt-20">
                    <button type="button" class="btn btn-outline flex-1" data-action="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary flex-1">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/citizen/adopt.js"></script>
</body>

</html>
